name: Monthly rebuild

# FIDE publishes new ratings once a month. Rebuild the site so that it shows them.
on:
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Cloudflare Pages deploy hook
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo "::warning::The CLOUDFLARE_DEPLOY_HOOK secret is not set. Skip the rebuild."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$CLOUDFLARE_DEPLOY_HOOK"
